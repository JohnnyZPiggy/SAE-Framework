# SAE V3.4 project configuration. Replace placeholders; pin an exact framework SHA.
sae_version: "3.4"
project:
  repository: "<OWNER>/<PROJECT>"
  package: "<PACKAGE_NAME>"
  scientific_goal: "<ALGORITHM_AND_PROBLEM>"
framework:
  repository: "JohnnyZPiggy/SAE-Framework"
  commit_sha: "<40-CHARACTER-SAE-SHA>"
  entrypoint: ".sae/README.md"
roles:
  scientist: "human"
  architect: "claude"
  mentor: "claude"
  engineer: "codex"
simplicity:
  dispatch_requires: ["definition_of_done", "size_budget", "required_tests", "not_required"]
  size_budgets_net_lines: {S: 50, M: 200, L: 500}
  stop_when_over_budget_factor: 1.5
  review_outcomes: ["ACCEPTED", "REQUEST_CHANGES", "REQUEST_SIMPLIFY"]
  evidence_file_caps: {docs: 0, code: 3, compute: 10}
collaboration:
  task_hub: "github_issues"
  actions_enabled: false
  engineer_may_merge: false
experiments:
  devices: ["cpu", "gpu"]
  scientist_compute_approval_required: false
  new_billing_requires_explicit_user_approval: true
  max_active_colab_sessions: 1
workflow:
  modes: ["EXPLORE", "VALIDATE"]
  max_self_repair_attempts_per_failure_class: 3
